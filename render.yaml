services:
  - type: web
    name: attendance-system
    runtime: node
    plan: free
    # --include=dev is REQUIRED: NODE_ENV=production makes npm skip devDependencies,
    # but tsc/vite/@types live there and are needed to build. Without it the build
    # exits with status 2 (tsc/vite not found).
    #
    # migrate + seed run at RUNTIME (start), not build — Render's build environment
    # cannot reach the database's internal host; only the running service can.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/dist/db/migrate.js && node server/dist/db/seed.js && node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Email via Brevo HTTP API (Render free tier restricts outbound SMTP, so SMTP won't work).
      # Set these two in the Render dashboard (sync:false = not committed to the repo).
      # SMTP_FROM must match the verified sender in your Brevo account.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance
    plan: free

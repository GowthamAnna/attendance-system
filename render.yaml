services:
  - type: web
    name: attendance-system
    runtime: node
    buildCommand: npm install && npm run build && node server/dist/db/migrate.js && node server/dist/db/seed.js
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Email via Brevo HTTP API (Render free tier restricts outbound SMTP, so SMTP won't work).
      # Set these two in the Render dashboard (sync:false = not committed to the repo).
      # SMTP_FROM must match the verified sender in your Brevo account.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance
    plan: free
